name: CI

# Security + quality gates for every change. Maps to CASA / OWASP ASVS controls:
#   - V1/V14 secure SDLC + dependency management (bun audit, Dependabot)
#   - SAST (Semgrep: secrets, OWASP Top Ten, JS/TS)
#   - automated test + typecheck on every PR
on:
  pull_request:
  push:
    branches: [main]
  # Manual post-deploy smoke: runs the live-HTTP auth sweep in tests/
  # against a deployed URL (see tests/public-endpoints-auth.test.ts).
  workflow_dispatch:
    inputs:
      public_base_url:
        description: "Deployed base URL for the live endpoint-auth smoke (optional)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # Runs the full unit suite with V8 coverage. The ratchet floor lives
      # in vitest.config.ts `coverage.thresholds` — a miss fails this step.
      # Raise the floor as coverage grows; never lower it to pass a PR.
      - name: Unit tests
        run: bun run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const t = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
              console.log("## Coverage\n\n| Metric | % | Covered |\n|---|---|---|");
              for (const k of ["statements","branches","functions","lines"]) console.log(row(k));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      # Schema drift gate: replays the migrations and asserts the
      # insert_folder_example_encrypted RPC only writes columns that still
      # exist on folder_examples. Catches column mismatches (Postgres 42703)
      # before deploy. Also covered by "Unit tests" above; kept as a named,
      # required step so the failure is obvious in the PR checks.
      - name: Schema consistency (folder_examples RPC)
        run: bun run test:schema
      # Regression gate for the in-person meeting transcript pipeline. Runs the
      # STT sanitizer golden-output snapshots plus the iOS-recording finalizer
      # regression. Fails the PR if the sanitizer output changes unexpectedly
      # (e.g. a runaway hallucination loop slips through, or normal speech gets
      # mangled). Update intentionally with: bun run test:meetings-transcript:update
      - name: Meetings transcript regression
        run: bun run test:meetings-transcript
      # Regression gate for the CardDAV iOS sync loop. Replays the exact PUT
      # shapes iOS sends (empty EMAIL, blank PREF EMAIL, grouped item labels,
      # missing EMAIL, legacy placeholders) through the parser + merge pipeline
      # and asserts the server never nulls a saved email. Required check —
      # failures block the PR so we can't regress the "iPhone wiped my email"
      # bug again.
      - name: CardDAV sync regression
        run: bun run test:carddav
      # Enforced: the codebase is ESLint-clean (0 errors, 0 warnings). Keep it
      # that way — lint failures block the PR.
      - name: Lint
        run: bun run lint --max-warnings=0

  # DB-backed integration tests (tests/*.integration.test.ts) — the only
  # suites that verify RLS / SECURITY DEFINER authorization (IDOR guards)
  # against a real Postgres. Runs the migrations via the Supabase CLI local
  # db, then the suite with TEST_DATABASE_URL pointed at it. The live-HTTP
  # endpoint sweep in the same dir stays skipped here (no PUBLIC_BASE_URL)
  # unless this run was dispatched manually with a deployed URL.
  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: supabase/setup-cli@v1
      - run: bun install --frozen-lockfile
      # `db start` boots only the Postgres container; `db reset --no-seed`
      # then applies every migration in supabase/migrations/.
      - name: Start local Postgres and apply migrations
        run: supabase db start && supabase db reset --no-seed
      - name: Run integration suite
        run: bun run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          PUBLIC_BASE_URL: ${{ inputs.public_base_url }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      # Gate on production dependencies. Dev-only advisories (e.g. build/lint
      # tooling) are tracked via Dependabot but don't block deploys.
      - name: Audit production dependencies
        run: bun audit --prod

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      # Pinned for reproducible, tamper-resistant scans (avoid moving :latest).
      image: semgrep/semgrep:1.164.0
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep scan
        run: >
          semgrep scan
          --config p/secrets
          --config p/owasp-top-ten
          --config p/javascript
          --config p/typescript
          --metrics=off
          --error
          src
